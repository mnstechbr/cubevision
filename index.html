<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CubeVision: um artefato holográfico no navegador, controlado pelas mãos. Uma demonstração técnica da MNS Tech." />
    <meta name="theme-color" content="#010409" />
    <title>CubeVision</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" role="img"></canvas>
    <div id="callouts" aria-hidden="true"></div>

    <header id="hud">
      <div id="layer-label" aria-live="polite"></div>
      <nav>
        <button id="cam-toggle" type="button" hidden></button>
        <button id="lang-toggle" type="button"></button>
        <a id="privacy-link" href="/privacidade.html" data-t="privacy"></a>
      </nav>
    </header>

    <div id="boot" class="overlay" role="status">
      <p class="boot-label"><span data-t="boot"></span><span class="dots"></span></p>
      <div class="bar"><i id="boot-bar"></i></div>
      <p id="boot-pct">0%</p>
    </div>

    <div id="entry" class="overlay" hidden>
      <div class="panel">
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="actions">
          <button id="go-camera" type="button" class="primary" data-t="useCamera"></button>
          <button id="go-mouse" type="button" data-t="useMouse"></button>
        </div>
        <p class="note" data-t="privacyNote"></p>
      </div>
    </div>

    <div id="caption" aria-live="polite"><b></b><span></span></div>
    <p id="hint" aria-live="polite" hidden></p>
    <p id="toast" role="alert" hidden></p>
    <div id="reveal" hidden>
      <p data-t="reveal"></p>
      <a href="https://mnstech.com.br" rel="noopener" data-t="revealLink"></a>
    </div>
    <div id="reticle" aria-hidden="true"></div>
    <p id="zoom-ind" aria-live="polite"></p>
    <aside id="hand-guide" hidden>
      <p class="hg-state"><span data-t="hgYou"></span> <b class="hg-open" data-t="hgOpenNow"></b><b class="hg-grab" data-t="hgGrabNow"></b><b class="hg-none" data-t="hgNoneNow"></b></p>
      <dl>
        <div class="hg-row grab"><dt>✊ ✥</dt><dd data-t="hgTurn"></dd></div>
        <div class="hg-row open"><dt>✋ ↕</dt><dd data-t="hgZoom"></dd></div>
        <div class="hg-row open"><dt>◎</dt><dd data-t="hgDive"></dd></div>
        <div class="hg-row"><dt>⤓</dt><dd data-t="hgOpen"></dd></div>
      </dl>
    </aside>
    <div id="cursors" aria-hidden="true"><i></i><i></i></div>
    <video id="cam" playsinline muted aria-hidden="true"></video>
    <canvas id="cam-skeleton" aria-hidden="true"></canvas>
    <pre id="fps" hidden></pre>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
